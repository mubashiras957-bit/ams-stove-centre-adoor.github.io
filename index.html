<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMS Stove Centre Adoor</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
font-family:'Poppins',sans-serif;
background:#0b0b0b;
color:#fff;
overflow-x:hidden;
cursor:none;
}

/* 🔥 Cursor */
.cursor{
position:fixed;
width:20px;height:20px;
border-radius:50%;
background:#ff9100;
pointer-events:none;
transform:translate(-50%,-50%);
mix-blend-mode:difference;
z-index:9999;
}

/* Progress bar */
.progress{
position:fixed;
top:0;left:0;
height:4px;
background:#ff9100;
width:0%;
z-index:999;
}

/* NAV */
nav{
position:fixed;
top:0;width:100%;
display:flex;
justify-content:center;
padding:15px;
transition:0.3s;
z-index:1000;
}

nav.scrolled{
background:rgba(0,0,0,0.7);
backdrop-filter:blur(10px);
}

nav a{
margin:0 20px;
color:#fff;
text-decoration:none;
}

/* HERO */
.hero{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
position:relative;
}

.hero::before{
content:'';
position:absolute;
width:400px;height:400px;
background:radial-gradient(circle,#ff3d00,transparent);
filter:blur(120px);
animation:float 6s infinite alternate;
}

@keyframes float{
0%{transform:translateY(-20px);}
100%{transform:translateY(20px);}
}

.hero h1{
font-size:60px;
font-weight:800;
background:linear-gradient(90deg,#ff3d00,#ff9100);
-webkit-background-clip:text;
color:transparent;
}

.btn{
margin-top:20px;
padding:15px 30px;
border-radius:50px;
background:#25D366;
color:#fff;
text-decoration:none;
display:inline-block;
transition:0.3s;
}

.btn:hover{
transform:scale(1.1);
}

/* Sections */
section{
padding:100px 20px;
max-width:1100px;
margin:auto;
}

.grid{
display:grid;
gap:25px;
}

@media(min-width:768px){
.grid-3{grid-template-columns:repeat(3,1fr);}
}

/* Cards */
.card{
background:rgba(255,255,255,0.05);
padding:30px;
border-radius:20px;
transition:0.3s;
transform:translateY(40px);
opacity:0;
}

.card.show{
transform:translateY(0);
opacity:1;
}

.card:hover{
transform:translateY(-10px) scale(1.05);
}

/* Counter */
.counter{
font-size:40px;
color:#ff9100;
}

/* WhatsApp */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
padding:20px;
border-radius:50%;
}

/* Popup */
.popup{
position:fixed;
bottom:100px;
right:20px;
background:#111;
padding:15px;
border-radius:10px;
display:none;
}

</style>
</head>

<body>

<div class="cursor"></div>
<div class="progress"></div>

<nav>
<a href="#">Home</a>
<a href="#services">Services</a>
<a href="#contact">Contact</a>
</nav>

<!-- HERO -->
<div class="hero">
<div>
<h1>AMS STOVE CENTRE</h1>
<p>Premium Stove Repair in Adoor</p>
<a class="btn">Book Service</a>
</div>
</div>

<!-- SERVICES -->
<section id="services">
<h2>Services</h2>

<div class="grid grid-3">
<div class="card">🔥 Sales</div>
<div class="card">🔧 Repair</div>
<div class="card">⚙️ Parts</div>
</div>
</section>

<!-- STATS -->
<section>
<h2>Our Impact</h2>

<div class="grid grid-3">
<div class="card"><div class="counter" data-target="500">0</div>Repairs</div>
<div class="card"><div class="counter" data-target="100">0</div>Customers</div>
<div class="card"><div class="counter" data-target="5">0</div>Years</div>
</div>
</section>

<!-- CONTACT -->
<section id="contact">
<h2>Contact</h2>
<div class="card">📞 9496506272</div>
</section>

<div class="popup">Need help? Chat with us!</div>
<a class="whatsapp">💬</a>

<script>
/* Cursor */
const cursor=document.querySelector('.cursor');
document.addEventListener('mousemove',e=>{
cursor.style.top=e.clientY+'px';
cursor.style.left=e.clientX+'px';
});

/* Scroll progress */
window.addEventListener('scroll',()=>{
let sc=(window.scrollY/(document.body.scrollHeight-window.innerHeight))*100;
document.querySelector('.progress').style.width=sc+'%';
});

/* Nav blur */
window.addEventListener('scroll',()=>{
document.querySelector('nav').classList.toggle('scrolled',window.scrollY>50);
});

/* Reveal */
const cards=document.querySelectorAll('.card');
window.addEventListener('scroll',()=>{
cards.forEach(el=>{
if(el.getBoundingClientRect().top<window.innerHeight-100){
el.classList.add('show');
}
});
});

/* Counter */
document.querySelectorAll('.counter').forEach(counter=>{
let update=()=>{
let target=+counter.getAttribute('data-target');
let count=+counter.innerText;
let inc=target/100;
if(count<target){
counter.innerText=Math.ceil(count+inc);
setTimeout(update,20);
}
};
update();
});

/* Popup */
setTimeout(()=>{
document.querySelector('.popup').style.display='block';
},5000);
</script>

</body>
</html>
